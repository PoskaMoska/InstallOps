name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv pip install --system -r pyproject.toml
        uv pip install --system pytest pytest-asyncio aiosqlite
        
    - name: Run Tests
      run: |
        pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker Image
      run: |
        docker build -t installops:latest .
        
    - name: Deploy to VPS
      run: |
        echo "Deployment is configured for Docker Compose."
        echo "Add your SSH/Deploy action here."
        # e.g., using appleboy/ssh-action to pull and restart on server
